<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración | Colectivo Flota Negra</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 16px;
    background: #0b0b0b;
    color: #eee;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 850px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 35px;
}

header h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

header p {
    color: #999;
}

h2 {
    font-size: 19px;
    margin-top: 0;
}

.panel {
    background: #171717;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 22px;
}

label {
    display: block;
    margin: 18px 0 8px;
    font-size: 14px;
    font-weight: bold;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    background: #090909;
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    font-size: 15px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

input:focus, textarea:focus, select:focus {
    outline: 1px solid #aaa;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    background: #eee;
    color: #111;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ccc;
}

#preview {
    display: none;
    margin-top: 20px;
}

.preview-card {
    display: flex;
    gap: 20px;
    align-items: flex-start;
}

.preview-card img {
    width: 150px;
    max-width: 40%;
    border-radius: 5px;
}

.preview-info {
    flex: 1;
}

.preview-info h3 {
    margin-top: 0;
}

.preview-info p {
    color: #bbb;
    line-height: 1.5;
}

.status {
    color: #aaa;
    font-size: 13px;
    margin-top: 18px;
}

@media (max-width: 500px) {
    .preview-card {
        flex-direction: column;
    }

    .preview-card img {
        width: 180px;
        max-width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>Colectivo Flota Negra</h1>
    <p>Administración del catálogo editorial</p>
</header>

<form id="bookForm">

<section class="panel">
    <h2>Datos del libro</h2>

    <label for="title">Título del libro</label>
    <input id="title" required placeholder="Título completo">

    <label for="author">Autor/a</label>
    <input id="author" required placeholder="Nombre del autor">

    <label for="year">Año de publicación</label>
    <input id="year" type="number" min="1900" max="2100" placeholder="2026">

    <label for="publisher">Editorial</label>
    <input id="publisher"
           value="Grupo Editor Colectivo Flota Negra">

    <label for="genre">Género</label>
    <input id="genre" placeholder="Música, cultura e historia">

    <label for="description">Descripción del libro</label>
    <textarea id="description"
              placeholder="Presentación y descripción del libro..."></textarea>
</section>

<section class="panel">
    <h2>Tapa y publicación</h2>

    <label for="cover">Imagen de tapa</label>
    <input id="cover" type="file" accept="image/*" required>

    <label for="status">Estado del libro</label>
    <select id="status">
        <option value="Próximamente">Próximamente</option>
        <option value="Publicado">Publicado</option>
    </select>
</section>

<section class="panel">
    <h2>Enlaces</h2>

    <label for="links">Enlaces relacionados</label>
    <textarea id="links"
              placeholder="Un enlace por línea. Por ejemplo:
https://www.instagram.com/
https://www.ejemplo.com/"></textarea>
</section>

<button type="submit">Generar vista previa</button>

</form>

<section class="panel" id="preview">
    <h2>Vista previa del libro</h2>

    <div class="preview-card">
        <img id="previewImage" alt="Tapa del libro">

        <div class="preview-info">
            <h3 id="previewTitle"></h3>
            <p id="previewAuthor"></p>
            <p id="previewYear"></p>
            <p id="previewPublisher"></p>
            <p id="previewGenre"></p>
            <p id="previewDescription"></p>
            <p id="previewStatus"></p>
        </div>
    </div>
</section>

<p class="status">
    Herramienta interna de administración · Colectivo Flota Negra
</p>

</div>

<script>
const form = document.getElementById("bookForm");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const file = document.getElementById("cover").files[0];

    if (!file) {
        alert("Tenés que seleccionar la tapa del libro.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function() {
        document.getElementById("previewImage").src = reader.result;

        document.getElementById("previewTitle").textContent =
            document.getElementById("title").value;

        document.getElementById("previewAuthor").textContent =
            "Autor/a: " + document.getElementById("author").value;

        document.getElementById("previewYear").textContent =
            "Año: " + document.getElementById("year").value;

        document.getElementById("previewPublisher").textContent =
            "Editorial: " + document.getElementById("publisher").value;

        document.getElementById("previewGenre").textContent =
            "Género: " + document.getElementById("genre").value;

        document.getElementById("previewDescription").textContent =
            document.getElementById("description").value;

        document.getElementById("previewStatus").textContent =
            "Estado: " + document.getElementById("status").value;

        document.getElementById("preview").style.display = "block";

        document.getElementById("preview").scrollIntoView({
            behavior: "smooth"
        });
    };

    reader.readAsDataURL(file);
});
</script>

</body>
</html>
